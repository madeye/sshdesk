name: Native tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up pinned Zig (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/setup-zig.sh .local-tools/zig >> "$GITHUB_PATH"
      - name: Set up pinned Zig (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zig = & ./scripts/setup-zig.ps1 -ToolchainDirectory '.local-tools/zig'
          Split-Path $zig | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install X11 test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libx11-6 libxtst6 libxext6 ffmpeg mesa-vulkan-drivers vulkan-validationlayers
      - name: Check Zig formatting
        run: zig fmt --check build.zig native
      - name: Native tests and ReleaseSafe executables (POSIX)
        if: runner.os != 'Windows'
        run: |
          scripts/with-zig-sdk.sh zig build test
          scripts/with-zig-sdk.sh zig build -Doptimize=ReleaseSafe
      - name: Native tests and ReleaseSafe executables (Windows)
        if: runner.os == 'Windows'
        run: |
          zig build test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          zig build -Doptimize=ReleaseSafe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Native command and synthetic session integration
        run: python -m unittest discover -s tests -v
      - name: Xvfb capture and input integration
        if: runner.os == 'Linux'
        run: |
          for mode in ffmpeg xshm x11; do
            SSHDESK_TEST_XVFB=1 SSHDESK_X11_CAPTURE="$mode" xvfb-run -a zig build test
          done
      - name: Vulkan compute pixels, concurrency, and validation layer
        if: runner.os == 'Linux'
        run: |
          zig build test-bin -Doptimize=ReleaseSafe
          scripts/test-vulkan.sh
      - name: Verify checked-in Vulkan shader
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/work" -w /work debian:bookworm-slim sh -c \
            'apt-get update && apt-get install -y glslang-tools spirv-tools && scripts/build-vulkan-shader.sh --check'
      - name: Check shell syntax
        if: runner.os != 'Windows'
        run: |
          for script in scripts/*.sh; do sh -n "$script"; done
      - name: Parse PowerShell installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $allErrors = @()
          foreach ($installer in (Get-ChildItem scripts/*.ps1)) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $installer.FullName, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            $allErrors += $parseErrors
          }
          if ($allErrors.Count) { $allErrors | Out-String | Write-Error; exit 1 }
